[project]
name = "csbench"
version = "0.1.0"
description = "Neutral, reproducible benchmark for code-search and code-context tools used by coding agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "bm25s==0.3.16",
    "huggingface-hub==2.4.0",
    "numpy==2.5.4",
    "pyarrow==26.0.1",
    "pyyaml==6.0.3",
    "tiktoken==0.14.0",
]

[project.scripts]
csbench = "csbench.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]
tools = [
    "semble==0.7.2",
]

[tool.uv]
default-groups = ["dev", "tools"]  # tools under test are always installed at their pins

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csbench"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
