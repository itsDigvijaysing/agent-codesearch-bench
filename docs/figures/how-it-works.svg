<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-label="How the benchmark works: a real bug report goes to a search tool (Track A) or a coding agent (Track B); the code they return is compared with the code people marked as needed; the scores are files found, lines found, tokens used and time"><title>How the benchmark works: a real bug report goes to a search tool (Track A) or a coding agent (Track B); the code they return is compared with the code people marked as needed; the scores are files found, lines found, tokens used and time</title><rect width="960" height="330" rx="16" fill="#fcfcfb" stroke="#e8e7e3"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/></marker></defs><text x="28" y="40" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">How the benchmark works</text><rect x="28" y="70" width="196" height="200" rx="12" fill="#ffffff" stroke="#e8e7e3" stroke-width="1"/><circle cx="48" cy="92" r="11" fill="#0b0b0b"/><text x="48" y="96.5" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><rect x="170" y="82" width="28" height="34" rx="4" fill="#f3f2ee" stroke="#52514e" stroke-width="1.6"/><line x1="176" y1="91" x2="192" y2="91" stroke="#8a8984" stroke-width="1.6" stroke-linecap="round"/><line x1="176" y1="97" x2="192" y2="97" stroke="#8a8984" stroke-width="1.6" stroke-linecap="round"/><line x1="176" y1="103" x2="192" y2="103" stroke="#8a8984" stroke-width="1.6" stroke-linecap="round"/><line x1="176" y1="109" x2="185" y2="109" stroke="#8a8984" stroke-width="1.6" stroke-linecap="round"/><text x="44" y="136" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">A real bug report</text><text x="44" y="160" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">The issue text from a real</text><text x="44" y="178" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">project: django, sympy,</text><text x="44" y="196" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">matplotlib, keras and more</text><text x="44" y="214" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">(100 tasks)</text><rect x="268" y="60" width="262" height="104" rx="12" fill="#ffffff" stroke="#e8e7e3" stroke-width="1"/><circle cx="288" cy="82" r="11" fill="#0b0b0b"/><text x="288" y="86.5" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">A</text><circle cx="495" cy="85" r="10" fill="none" stroke="#2a78d6" stroke-width="3"/><line x1="502" y1="92" x2="512" y2="102" stroke="#2a78d6" stroke-width="3.5" stroke-linecap="round"/><text x="308" y="87" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">Track A: a search tool</text><text x="288" y="115" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">gets the issue text as its query</text><text x="288" y="133" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">and returns its top 10 results</text><rect x="268" y="178" width="262" height="104" rx="12" fill="#ffffff" stroke="#e8e7e3" stroke-width="1"/><circle cx="288" cy="200" r="11" fill="#0b0b0b"/><text x="288" y="204.5" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">B</text><rect x="482" y="190" width="34" height="28" rx="5" fill="#2b2b29"/><path d="M489,199 l6,5 l-6,5" fill="none" stroke="#f0efec" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="498" y1="210" x2="508" y2="210" stroke="#f0efec" stroke-width="2" stroke-linecap="round"/><text x="308" y="205" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">Track B: a coding agent</text><text x="288" y="233" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">searches and reads files, with or</text><text x="288" y="250" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">without a tool, then lists the code</text><text x="288" y="267" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">it would change</text><rect x="574" y="70" width="196" height="200" rx="12" fill="#fffaf0" stroke="#c98500" stroke-width="1"/><circle cx="594" cy="92" r="11" fill="#0b0b0b"/><text x="594" y="96.5" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><rect x="716" y="86" width="34" height="9" rx="2" fill="#fdf1d6" stroke="#c98500"/><rect x="716" y="99" width="24" height="9" rx="2" fill="#fdf1d6" stroke="#c98500"/><path d="M736,102.0 l4.0,4.0 l8.0,-9.0" fill="none" stroke="#c98500" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="590" y="136" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">Compare with the</text><text x="590" y="155" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">answer key</text><text x="590" y="180" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">the code that people marked</text><text x="590" y="198" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">as needed for the real fix</text><text x="590" y="216" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">(ContextBench)</text><rect x="812" y="70" width="120" height="200" rx="12" fill="#ffffff" stroke="#e8e7e3" stroke-width="1"/><circle cx="832" cy="92" r="11" fill="#0b0b0b"/><text x="832" y="96.5" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="828" y="136" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">Scores</text><rect x="828" y="152" width="92" height="22" rx="11" fill="#f3f2ee" stroke="none" stroke-width="1"/><text x="874" y="167.5" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">files found</text><rect x="828" y="180" width="92" height="22" rx="11" fill="#f3f2ee" stroke="none" stroke-width="1"/><text x="874" y="195.5" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">lines found</text><rect x="828" y="208" width="92" height="22" rx="11" fill="#f3f2ee" stroke="none" stroke-width="1"/><text x="874" y="223.5" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">tokens used</text><rect x="828" y="236" width="92" height="22" rx="11" fill="#f3f2ee" stroke="none" stroke-width="1"/><text x="874" y="251.5" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">time taken</text><line x1="226" y1="140" x2="264" y2="112" stroke="#8a8984" stroke-width="2" marker-end="url(#ah)"/><line x1="226" y1="200" x2="264" y2="230" stroke="#8a8984" stroke-width="2" marker-end="url(#ah)"/><line x1="532" y1="112" x2="570" y2="140" stroke="#8a8984" stroke-width="2" marker-end="url(#ah)"/><line x1="532" y1="230" x2="570" y2="200" stroke="#8a8984" stroke-width="2" marker-end="url(#ah)"/><line x1="772" y1="170" x2="808" y2="170" stroke="#8a8984" stroke-width="2" marker-end="url(#ah)"/><text x="480.0" y="312" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">Every tool runs with its own default settings. Nothing is tuned for the test.</text></svg>
