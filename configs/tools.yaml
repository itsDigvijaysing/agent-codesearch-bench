# Pinned tools. status: active (in Track A runs), planned, excluded, track_b.
# Tools with `env` run in their own venv installed from that lock file (`csbench lock`).
# Defaults first; a tuned configuration gets its own entry with a "-tuned" suffix.
tools:
  grep:
    adapter: grep
    pin: "ripgrep 14.1.0"   # system binary; the version actually used is recorded per task
    status: active
    params: {context: 3, max_terms: 64}
  grep-distinct:
    adapter: grep
    pin: "ripgrep 14.1.0"
    status: active
    params: {context: 3, max_terms: 64, rank: distinct}
    note: "Same terms as grep; files ranked by distinct terms matched first, then hits."
  bm25:
    adapter: bm25
    pin: "bm25s==0.3.16"
    status: active
    params: {chunk_lines: 50, k1: 1.5, b: 0.75}
  semble:
    adapter: semble
    pin: "semble==0.7.2"
    env: configs/envs/semble.txt
    status: active
    params:
      model: minishlab/potion-code-16M-v2     # semble's default model, pinned revision
      model_revision: e9d2a44ca6a05ac6685f3b23709ea57eb7352d5b
    note: "Python API SembleIndex.from_path(repo).search(query, top_k), default settings."
  graphify:
    adapter: graphify
    pin: "graphifyy==0.9.102"
    env: configs/envs/graphify.txt
    status: active
    note: "CLI: extract --code-only with GRAPHIFY_BACKEND=none (AST only), query defaults."
  code-review-graph:
    adapter: code-review-graph
    pin: "code-review-graph==2.3.9"
    env: configs/envs/code-review-graph.txt
    status: active
    note: "CLI: build, then search --limit K (keyword FTS5; no embeddings, no LLM)."
  serena:
    adapter: none
    pin: "TBD"
    status: track_b
    note: "Agent-driven symbolic navigation, not free-text retrieval; evaluated in Track B."
  claude-context:
    adapter: none
    pin: "TBD"
    status: planned
    note: "v2: needs a Milvus instance and an embedding API key."
