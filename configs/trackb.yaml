# Track B: an agent (Claude Code cloud session) localizes the code an issue needs, with and
# without each tool. Identical prompt for every arm; arms differ only in a project setup line
# and the tool's own documented agent instructions, given as CLAUDE.md project instructions at
# the top of the prompt (where the tools' installers put them; the session API ignores
# append_system_prompt).
# The tools are preinstalled for every arm by the cloud environment's setup script:
#   uv tool install semble==0.7.2 graphifyy==0.9.102 code-review-graph==2.3.9 (one per line)
# so all arms run on the same machine image. code-review-graph and Serena are not arms: their
# documented agent integration is an MCP server, which a cloud session cannot have configured
# before it starts without also exposing it to the baseline arm.
sample: data/sample_v1.txt
runs:  # name: model and number of sample tasks (a prefix of the seeded sample)
  trackb-pilot: {model: claude-haiku-5-5, limit: 10, arms: [baseline, semble]}
  trackb-haiku: {model: claude-haiku-5-5, limit: 100}
  trackb-sonnet: {model: claude-sonnet-5-5, limit: 20}
  # Local run (csbench trackb-local): headless sessions in a sandbox on one machine, indexes
  # built before each session and timed separately, so the setup line is dropped.
  trackb-hard-haiku: {model: claude-haiku-5-5, sample: data/sample_hard.txt, limit: 50, prebuild: true}
max_locations: 20
prompt: |
  You are in a checkout of {repo} at the commit where the issue below was reported.
  Find the code that must be read or changed to fix this issue. Do not modify any file, do not
  run the test suite, and do not use web search or web fetch.
  {setup}
  When you are done, end your reply with exactly one JSON code block of this form, listing the
  most important locations first, at most {max_locations}:
  ```json
  {{"locations": [{{"file": "path/relative/to/repo/root", "start_line": 1, "end_line": 20}}]}}
  ```

  <issue>
  {issue}
  </issue>
arms:
  baseline:
    setup: ""
    instructions: null
  semble:
    setup: ""  # preinstalled; the index builds on the first search
    instructions: configs/trackb/semble.md
  graphify:
    # the exclude keeps graphify-out/ out of git status (an untracked folder triggers the
    # environment's commit reminder, which made agents do unrelated extra work)
    setup: "Before you start, build the code graph once with: GRAPHIFY_BACKEND=none graphify extract . --code-only && echo graphify-out/ >> .git/info/exclude"
    instructions: configs/trackb/graphify.md
